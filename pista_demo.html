<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demonstração Visual da Pista 2.5D - Corrida TikTok</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .header {
      margin-bottom: 12px;
      text-align: center;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 900;
      color: #38bdf8;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .header p {
      font-size: 13px;
      color: #94a3b8;
    }
    .stage {
      position: relative;
      width: 360px;
      height: 640px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.25), 0 0 0 3px #1e293b;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 360px;
    }
    .btn {
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #334155;
      border-color: #38bdf8;
    }
    .btn-tap {
      background: #0284c7;
      border-color: #38bdf8;
    }
    .btn-tap:hover {
      background: #0369a1;
    }
    .btn-turbo {
      background: #d97706;
      border-color: #facc15;
    }
    .btn-turbo:hover {
      background: #b45309;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🏁 PISTA OFICIAL 2.5D (TIKTOK LIVE)</h1>
    <p>Renderização com Asfalto Neon, Zebras Animadas e Câmera Elástica</p>
  </div>

  <div class="stage">
    <canvas id="raceCanvas" width="540" height="960"></canvas>
  </div>

  <div class="controls">
    <button class="btn btn-tap" id="btnTap">👆 Tap-Tap (+Aceleração)</button>
    <button class="btn btn-turbo" id="btnTurbo">⚡ Super Turbo (+Aura & Fogo)</button>
    <button class="btn" id="btnAddKart">🏎️ + Corredor</button>
    <button class="btn btn-win" id="btnWin" style="background: #eab308; color: #000; border-color: #facc15;">🏆 Cruzar Chegada (Confetes)</button>
  </div>

  <!-- Importa o Script Oficial da Pista -->
  <script src="./SCRIPT_PISTA_OFICIAL.js"></script>

  <script>
    const engine = new TrackEngine(document.getElementById('raceCanvas'));

    // Adiciona 4 corredores de demonstração
    engine.addPlayer('1', 'joao_pro', null);
    engine.addPlayer('2', 'maria_vip', null);
    engine.addPlayer('3', 'pedro_speed', null);
    engine.addPlayer('4', 'ana_turbo', null);

    // Inicia a renderização a 60 FPS
    engine.start();

    // Controles de teste
    document.getElementById('btnTap').addEventListener('click', () => {
      engine.triggerTap('1', 3);
    });

    document.getElementById('btnTurbo').addEventListener('click', () => {
      const tiers = [1, 2, 3, 4];
      const tier = tiers[Math.floor(Math.random() * tiers.length)];
      engine.triggerTurbo('2', tier);
    });

    document.getElementById('btnAddKart').addEventListener('click', () => {
      const id = String(Date.now());
      const nomes = ['lucas', 'camila', 'felipe', 'beatriz', 'rafael'];
      const n = nomes[Math.floor(Math.random() * nomes.length)] + '_' + Math.floor(Math.random() * 99);
      engine.addPlayer(id, n, null);
    });

    document.getElementById('btnWin').addEventListener('click', () => {
      const leader = engine.state.players.get('1');
      if (leader) {
        leader.distance = engine.state.raceDistance;
        engine.state.status = 'finished';
        engine.state.confetti = [];
        for (let i = 0; i < 90; i++) {
          engine.state.confetti.push({
            x: Math.random() * engine.width,
            y: -20 - Math.random() * 300,
            vx: (Math.random() - 0.5) * 90,
            vy: 110 + Math.random() * 140,
            color: engine.kartColors[i % engine.kartColors.length],
            size: 6 + Math.random() * 6,
            angle: Math.random() * Math.PI * 2
          });
        }
      }
    });
  </script>

</body>
</html>
